{% load static %}
{% load blog_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %} {%endblock%}
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>
    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
    <div id="sidebar">
        <h2>My blog</h2>
        <p>This is my blog.</p>
        I've written a total of {% total_posts %} posts.
        <p> 
        <a href="{% url 'blog:post_feed' %}">Subscribe to my blog feed</a>
        </p>
        <h3>Ultimos Post </h3>
        {% show_latest_posts 3 %}
    </div>
</body>
</html>
